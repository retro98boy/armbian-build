SectionVerb {
	Value {
		TQ "HiFi"
	}

	EnableSequence [
		# FRDDR_A -> TDMOUT_A -> TOHDMITX I2S A -> HDMI
		cset "name='TOHDMITX I2S OUT EN Switch' off"
		cset "name='TOHDMITX SPDIF OUT EN Switch' off"
		cset "name='FRDDR_A SRC 2 EN Switch' off"
		cset "name='FRDDR_A SRC 3 EN Switch' off"
		cset "name='FRDDR_A SINK 1 SEL' 'OUT 0'"
		cset "name='FRDDR_A SRC 1 EN Switch' on"
		cset "name='TDMOUT_A SRC SEL' 'IN 0'"
		cset "name='TDMOUT_A Gain Enable Switch' off"
		cset "name='TDMOUT_A Lane 0 Volume' 255,255"
		cset "name='TDMOUT_A Lane 1 Volume' 255,255"
		cset "name='TDMOUT_A Lane 2 Volume' 255,255"
		cset "name='TDMOUT_A Lane 3 Volume' 255,255"
		cset "name='TOHDMITX I2S SRC' 'I2S A'"
	]

	DisableSequence [
		cset "name='TOHDMITX I2S OUT EN Switch' off"
		cset "name='FRDDR_A SRC 1 EN Switch' off"
	]
}

SectionDevice."HDMI" {
	Comment "HDMI output"

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}

	EnableSequence [
		cset "name='TOHDMITX I2S OUT EN Switch' on"
	]

	DisableSequence [
		cset "name='TOHDMITX I2S OUT EN Switch' off"
	]
}
