SectionVerb {
	Value {
		TQ "HiFi"
	}

	EnableSequence [
		cset "name='Speaker Switch' off"
		cset "name='Playback Mux' HP"
	]

	DisableSequence [
		cset "name='Speaker Switch' off"
	]
}

# The headphones and speaker amplifier share the RK809 headphone outputs.
SectionDevice."Speakers" {
	Comment "Speakers"

	ConflictingDevice [
		"Headphones"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackMixerElem "Master"
	}

	EnableSequence [
		cset "name='Playback Mux' HP"
		cset "name='Speaker Switch' on"
	]

	DisableSequence [
		cset "name='Speaker Switch' off"
	]
}

SectionDevice."Headphones" {
	Comment "Headphones"

	ConflictingDevice [
		"Speakers"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackMixerElem "Master"
		JackControl "Headphones Jack"
	}

	EnableSequence [
		cset "name='Speaker Switch' off"
		cset "name='Playback Mux' HP"
	]
}

SectionDevice."Mic" {
	Comment "Headset Microphone"

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},0"
		CaptureChannels 2
		CaptureMixerElem "Mic Capture Gain"
		CaptureMasterElem "Master"
		JackControl "Headphones Jack"
	}
}
