SectionVerb {
	Value {
		TQ "HiFi"
	}

	EnableSequence [
		cset "name='Playback Path' OFF"
		cset "name='Capture MIC Path' 'MIC OFF'"
	]

	DisableSequence [
		cset "name='Playback Path' OFF"
		cset "name='Capture MIC Path' 'MIC OFF'"
	]
}

SectionDevice."Speakers" {
	Comment "Speakers"

	ConflictingDevice [
		"Headphones"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackMixerElem "DAC"
	}

	EnableSequence [
		cset "name='Playback Path' SPK"
	]

	DisableSequence [
		cset "name='Playback Path' OFF"
	]
}

SectionDevice."Headphones" {
	Comment "Headphones"

	ConflictingDevice [
		"Speakers"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackMixerElem "DAC"
		JackControl "Headphone Jack"
	}

	EnableSequence [
		cset "name='Playback Path' HP"
	]

	DisableSequence [
		cset "name='Playback Path' OFF"
	]
}

SectionDevice."Mic" {
	Comment "Microphone"

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},0"
		CaptureChannels 2
		CaptureMixerElem "ADC"
	}

	EnableSequence [
		cset "name='Capture MIC Path' 'Main Mic'"
	]

	DisableSequence [
		cset "name='Capture MIC Path' 'MIC OFF'"
	]
}
